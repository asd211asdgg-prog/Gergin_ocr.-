name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack project and add model
        run: |
          unzip -o project.zip -d app_project
          cp best.tflite app_project/app/src/main/assets/best.tflite
          cp labels.txt app_project/app/src/main/assets/labels.txt
      - name: Build
        working-directory: app_project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: georgian-ocr-apk
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
